<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise — white · pink · brown · blue · violet</title>
<style>
  :root {
    --bg: #0e0e10;
    --fg: #f4f1ea;
    --muted: #8a8780;
    --ring: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.25rem;
    -webkit-font-smoothing: antialiased;
    transition: background 0.6s ease;
  }
  header {
    text-align: center;
    margin-bottom: 2.75rem;
  }
  h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--muted);
    margin-top: 0.6rem;
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 720px;
  }
  .card {
    position: relative;
    border: 1px solid var(--ring);
    background: rgba(255,255,255,0.02);
    border-radius: 16px;
    padding: 1.4rem 1.2rem 1.5rem;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.1s ease;
    overflow: hidden;
  }
  .card:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.04); }
  .card:active { transform: scale(0.985); }
  .card .swatch {
    width: 34px; height: 34px;
    border-radius: 9px;
    margin-bottom: 1rem;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset;
  }
  .card .name { font-size: 1.05rem; font-weight: 600; }
  .card .desc { color: var(--muted); font-size: 0.82rem; margin-top: 0.3rem; line-height: 1.35; }
  .card .state {
    margin-top: 1rem;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .card.playing {
    border-color: var(--accent);
    background: rgba(255,255,255,0.05);
  }
  .card.playing .state { color: var(--accent); }
  .card.playing .swatch { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 0 0 var(--accent); } 50% { box-shadow: 0 0 0 1px rgba(255,255,255,0.06) inset, 0 0 22px -2px var(--accent); } }
  .controls {
    margin-top: 2.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 720px;
  }
  .controls label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--fg);
    height: 4px;
  }
  footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.75rem; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>Noise</h1>
    <p>Tap a color to play. Tap again to stop.</p>
  </header>

  <div class="grid" id="grid"></div>

  <div class="controls">
    <label for="vol">Volume</label>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.5">
  </div>

  <footer>Generated live in your browser — no files, works offline.</footer>

<script>
const TYPES = [
  { key: "white",  name: "White",  color: "#f4f1ea", accent: "#ffffff", desc: "Equal energy at every frequency. Bright and full." },
  { key: "pink",   name: "Pink",   color: "#f3a6c0", accent: "#ff8fb8", desc: "Drops with frequency. Softer, balanced, natural." },
  { key: "brown",  name: "Brown",  color: "#b07a4d", accent: "#d68a4a", desc: "Deep and rumbling. Like rainfall or surf." },
  { key: "blue",   name: "Blue",   color: "#7fb3ff", accent: "#5aa0ff", desc: "Rises with frequency. Crisp, hissy, airy." },
  { key: "violet", name: "Violet", color: "#c79bff", accent: "#b98aff", desc: "Steepest high end. Sharp, very bright." },
];

let ctx = null;
let master = null;
let current = null;       // { key, node, gain }
const cards = {};

const BUF_SECONDS = 4;

function ensureCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = parseFloat(volEl.value);
    master.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
}

// Build a looping buffer of white noise, then color it per-type.
function makeNoiseBuffer(type) {
  const len = ctx.sampleRate * BUF_SECONDS;
  const buffer = ctx.createBuffer(1, len, ctx.sampleRate);
  const out = buffer.getChannelData(0);

  // base white noise
  const white = new Float32Array(len);
  for (let i = 0; i < len; i++) white[i] = Math.random() * 2 - 1;

  if (type === "white") {
    out.set(white);
  } else if (type === "pink") {
    // Paul Kellet's refined pink noise filter
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < len; i++) {
      const w = white[i];
      b0 = 0.99886*b0 + w*0.0555179;
      b1 = 0.99332*b1 + w*0.0750759;
      b2 = 0.96900*b2 + w*0.1538520;
      b3 = 0.86650*b3 + w*0.3104856;
      b4 = 0.55000*b4 + w*0.5329522;
      b5 = -0.7616*b5 - w*0.0168980;
      out[i] = (b0+b1+b2+b3+b4+b5+b6 + w*0.5362) * 0.11;
      b6 = w * 0.115926;
    }
  } else if (type === "brown") {
    // integrate white noise (random walk), with leak to avoid drift
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + 0.02 * white[i]) / 1.02;
      out[i] = last * 3.5;
    }
  } else if (type === "blue") {
    // differentiate white noise: rises ~+3dB/oct
    let prev = 0;
    for (let i = 0; i < len; i++) {
      out[i] = (white[i] - prev) * 0.5;
      prev = white[i];
    }
  } else if (type === "violet") {
    // second-order difference: rises ~+6dB/oct, steepest high end
    let prev = 0, prev2 = 0;
    for (let i = 0; i < len; i++) {
      out[i] = (white[i] - 2*prev + prev2) * 0.3;
      prev2 = prev;
      prev = white[i];
    }
  }

  // normalize to avoid clipping
  let peak = 0;
  for (let i = 0; i < len; i++) { const a = Math.abs(out[i]); if (a > peak) peak = a; }
  if (peak > 0) { const g = 0.9 / peak; for (let i = 0; i < len; i++) out[i] *= g; }

  return buffer;
}

function stop() {
  if (current) {
    try { current.gain.gain.setTargetAtTime(0, ctx.currentTime, 0.04); } catch(e){}
    const node = current.node;
    setTimeout(() => { try { node.stop(); } catch(e){} }, 120);
    cards[current.key].classList.remove("playing");
    current = null;
  }
  document.body.style.background = "var(--bg)";
}

function play(type) {
  ensureCtx();
  const node = ctx.createBufferSource();
  node.buffer = makeNoiseBuffer(type.key);
  node.loop = true;
  const gain = ctx.createGain();
  gain.gain.value = 0;
  node.connect(gain).connect(master);
  node.start();
  gain.gain.setTargetAtTime(1, ctx.currentTime, 0.06);
  current = { key: type.key, node, gain };
  cards[type.key].classList.add("playing");
  document.body.style.background =
    `radial-gradient(circle at 50% 35%, ${hexA(type.color,0.10)}, var(--bg) 60%)`;
}

function toggle(type) {
  const wasPlaying = current && current.key === type.key;
  stop();
  if (!wasPlaying) play(type);
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// build UI
const grid = document.getElementById("grid");
const volEl = document.getElementById("vol");

TYPES.forEach(t => {
  const card = document.createElement("button");
  card.className = "card";
  card.style.setProperty("--accent", t.accent);
  card.innerHTML = `
    <div class="swatch" style="background:${t.color}"></div>
    <div class="name">${t.name}</div>
    <div class="desc">${t.desc}</div>
    <div class="state">Tap to play</div>`;
  card.addEventListener("click", () => {
    toggle(t);
    // refresh state labels
    TYPES.forEach(x => {
      const playing = current && current.key === x.key;
      cards[x.key].querySelector(".state").textContent = playing ? "Playing" : "Tap to play";
    });
  });
  grid.appendChild(card);
  cards[t.key] = card;
});

volEl.addEventListener("input", () => {
  if (master) master.gain.setTargetAtTime(parseFloat(volEl.value), ctx.currentTime, 0.02);
});

// keyboard: space stops, 1-5 select
window.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); stop(); TYPES.forEach(x=>cards[x.key].querySelector(".state").textContent="Tap to play"); }
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= TYPES.length) cards[TYPES[i-1].key].click();
});
</script>
</body>
</html>
